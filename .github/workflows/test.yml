name: test

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.zig"
      - "**.zon"
      - "build.zig"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "**.zig"
      - "**.zon"
      - "build.zig"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Zig Tests
    runs-on: ubuntu-latest
    environment: Testing
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1

      - name: Run Zig tests
        run: zig build test --summary all

      - name: Type-check library and tests
        run: zig build check
